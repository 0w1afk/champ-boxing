# Настройки проекта для Codex. Роли и обоснование моделей: docs/process/workflow.md

# Основная сессия: оркестратор процесса.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[agents]
# Агенты работают последовательно по этапам, параллель нужна редко.
max_concurrent_threads_per_session = 3
# Агенты не запускают других агентов: всё проходит через оркестратора.
max_depth = 1
