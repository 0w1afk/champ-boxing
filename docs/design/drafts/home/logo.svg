<!--
  CHAMP — вордмарк клуба (направление «Макро-нуар»).
  Решение пользователя от 2026-11-05: новый логотип, старый logo1-1_uweO.png не используется.
  Шрифт: Oswald 700 (капс), fallback 'Arial Narrow', sans-serif.
  Файл самодостаточен как черновик; при переносе в прод (S7) текст «CHAMP»
  конвертируется в кривые (paths), чтобы не зависеть от подключённого шрифта.
  Доступное имя ссылки вокруг — «CHAMP BOXING CLUB — на главную» (текст G4 дословно).
  Контраст: текст #ece7de на #0b0a09 — 16.06:1; ромб #E4570C — графика ≥3:1 (5.34:1).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 40" width="156" height="40" role="img" aria-label="CHAMP">
  <rect x="2" y="9" width="11" height="11" transform="rotate(45 7.5 14.5)" fill="#E4570C"></rect>
  <text x="24" y="30" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="700" font-size="27" letter-spacing="2.5" fill="#ece7de">CHAMP</text>
</svg>
