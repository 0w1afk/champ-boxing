# champ-box.ru: сайт клуба, сборка prod (base /) из /srv/champ-box.ru/www (./deploy.sh prod).
# nginx 1.18 на хосте (Ubuntu 20.04, без Docker); HTTP/2 включается в listen.
# На сервере: /etc/nginx/sites-available/champ-box.ru.conf + симлинк в sites-enabled.
# Включать только после выпуска сертификата (порядок — README, «Запуск champ-box.ru»):
# без файлов /etc/letsencrypt/live/champ-box.ru/ проверка `nginx -t` не пройдёт.
# Проверки Let's Encrypt до включения отвечает default_server из gussy-pussy.ru.conf.

# http → https, www → без www; challenge Let's Encrypt — до редиректа
server {
    listen 80;
    listen [::]:80;
    server_name champ-box.ru www.champ-box.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://champ-box.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.champ-box.ru;

    ssl_certificate /etc/letsencrypt/live/champ-box.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/champ-box.ru/privkey.pem;

    return 301 https://champ-box.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name champ-box.ru;

    ssl_certificate /etc/letsencrypt/live/champ-box.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/champ-box.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    root /srv/champ-box.ru/www;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Хешированные ассеты Astro — кэш на год. Свой add_header отменяет
    # наследование заголовков сервера, поэтому security-заголовки дублируем.
    location ^~ /_astro/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
}
