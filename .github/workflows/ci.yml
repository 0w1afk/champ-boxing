name: CI

# Проверки на каждый пуш и PR. Выкладка — отдельный workflow Deploy (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Типы и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Тестовый поддомен: та же сборка, что уходит на champ.zimorodok-dev.ru.
      SITE_TARGET: dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Типы и разметка (Astro)
        run: npm run check --if-present

      - name: Сборка под https://champ.zimorodok-dev.ru/
        run: npm run build
